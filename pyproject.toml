[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "saa-scheduling"
version = "0.2.0"
description = "Sample average approximation for stochastic business process scheduling"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["saa_scheduling*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
